# SDDM state.
#
# Seeded so the greeter preselects TacoLinux's own session instead of
# whatever order the session files happen to come back from readdir() in.
# SDDM matches this against the session *file name*, so it must end in
# .desktop.
#
# RememberLastSession (on by default) rewrites this file after a login, so
# once a user picks XFCE it stays picked for them.
[Last]
Session=dwm.desktop
