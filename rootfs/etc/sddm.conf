# TacoLinux SDDM configuration.
#
# Sessions are defined in /usr/share/xsessions: dwm (the hand-built default)
# and XFCE (from the Nix desktop profile).  SDDM itself comes from that same
# profile; see /usr/local/bin/taco-sddm and scripts/build-desktop.sh.

[General]
HaltCommand=/usr/bin/systemctl poweroff
RebootCommand=/usr/bin/systemctl reboot
Numlock=none
# Render the greeter with Qt's software backend.
#
# TacoLinux boots on machines with no GPU and the desktop closure does not
# pull in Mesa, so Qt Quick's default OpenGL backend cannot initialise GLX and
# sddm-greeter aborts, leaving a black screen.  Software rendering is plenty
# for a login screen and works everywhere.  This is SDDM's own mechanism: the
# greeter's environment is a fixed whitelist, so a plain Environment= in the
# unit would not reach it.
GreeterEnvironment=QT_QUICK_BACKEND=software

[Users]
MaximumUid=60000
MinimumUid=1000

[X11]
ServerPath=/usr/bin/X
SessionDir=/usr/share/xsessions
EnableHiDPI=true

[Wayland]
EnableHiDPI=true
