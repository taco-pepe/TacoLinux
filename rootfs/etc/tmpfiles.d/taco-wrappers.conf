# Setuid helpers the Nix desktop profile expects to find in /run/wrappers.
#
# Nix builds linux-pam's pam_unix.so to shell out to /run/wrappers/bin/unix_chkpwd
# whenever it cannot read /etc/shadow itself -- which is the case for the
# unprivileged SDDM greeter and for `passwd` run by a normal user.  NixOS
# creates that wrapper from security.wrappers; there is no equivalent here, so
# taco-wrappers.service installs it at boot.
#
# This file only creates the directories.  The service must dereference the
# profile symlink before copying: systemd-tmpfiles' C+ copies a symlink as a
# symlink, which left /run/wrappers/bin/unix_chkpwd pointing at a non-setuid
# store file and broke every unprivileged password check.
d  /run/wrappers     0755 root root -
d  /run/wrappers/bin 0755 root root -
