# Setuid helpers the Nix desktop profile expects to find in /run/wrappers.
#
# Nix builds linux-pam's pam_unix.so to shell out to /run/wrappers/bin/unix_chkpwd
# whenever it cannot read /etc/shadow itself -- which is the case for the
# unprivileged SDDM greeter.  NixOS creates that wrapper from security.wrappers;
# there is no equivalent here, so make a setuid copy at boot.  /run is a tmpfs,
# so this cannot be a committed file (and git would not keep the setuid bit).
#
# The source lives in the desktop profile, so this is a no-op on a base system
# without the desktop closure (systemd-tmpfiles will log that it could not copy).
d  /run/wrappers     0755 root root -
d  /run/wrappers/bin 0755 root root -
C+ /run/wrappers/bin/unix_chkpwd 4755 root root - /nix/var/nix/profiles/desktop/bin/unix_chkpwd
